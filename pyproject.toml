[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiagenttrainer"
version = "2.0.0"
description = "Collect data from multiple sources and run autonomous LLM training via autoresearch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "gitpython>=3.1",
    "boto3>=1.28",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
opensource = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "trl>=0.8",
    "bitsandbytes>=0.43",
    "accelerate>=0.27",
]

[project.scripts]
mat = "multiagenttrainer.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors — PEP 8 style violations
    "F",    # pyflakes — undefined names, unused imports, etc.
    "I",    # isort — import ordering
    "N",    # pep8-naming — class/function/variable naming conventions
    "UP",   # pyupgrade — modernise syntax for the target Python version
    "B",    # flake8-bugbear — likely bugs and design problems
    "SIM",  # flake8-simplify — suggest simpler equivalent expressions
    "RUF",  # ruff-specific rules — fast, Ruff-native checks
]

[tool.ruff.lint.per-file-ignores]
"deploy/**" = ["E501"]  # Pulumi infra strings (YAML snippets, JSON policies) can't be wrapped

[tool.ruff.lint.isort]
known-first-party = ["multiagenttrainer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
